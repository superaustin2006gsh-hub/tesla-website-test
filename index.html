<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Website Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1a 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 2.5rem;
    letter-spacing: 3px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #cc0000, #ff4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    color: #888;
    margin-bottom: 40px;
    font-size: 1.1rem;
  }
  .car-container {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  svg { width: 100%; height: auto; }
  .mod-label {
    font-size: 13px;
    fill: #ffcc00;
    font-weight: bold;
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
  }
  .mod-line {
    stroke: #ffcc00;
    stroke-width: 1.5;
    stroke-dasharray: 4 3;
    fill: none;
  }
  .footer {
    margin-top: 40px;
    color: #555;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1>THIS IS A TESLA WEBSITE TEST</h1>
  <p class="subtitle">Every mod your Tesla can rock</p>
  <div class="car-container">
    <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
      <!-- Ground shadow -->
      <ellipse cx="450" cy="390" rx="380" ry="18" fill="rgba(0,0,0,0.5)"/>

      <!-- Wheels -->
      <circle cx="250" cy="340" r="55" fill="#222" stroke="#444" stroke-width="8"/>
      <circle cx="250" cy="340" r="28" fill="#111" stroke="#cc0000" stroke-width="3"/>
      <circle cx="650" cy="340" r="55" fill="#222" stroke="#444" stroke-width="8"/>
      <circle cx="650" cy="340" r="28" fill="#111" stroke="#cc0000" stroke-width="3"/>

      <!-- Body -->
      <path d="M120 300 L160 300 L180 250 L250 210 L330 190 L480 185 L560 200 L640 230 L700 250 L760 280 L780 300 L820 300 L820 330 L120 330 Z" fill="#1c1c1c" stroke="#333" stroke-width="2"/>
      <!-- Glass roof -->
      <path d="M250 210 L330 190 L480 185 L560 200 L620 235 L560 250 L330 250 L250 235 Z" fill="#0a0a0a" opacity="0.85"/>
      <!-- Side windows -->
      <path d="L180 250 L250 210 L250 235 L180 265 Z" fill="#0a0a0a" opacity="0.7"/>
      <path d="L640 230 L700 250 L700 265 L640 250 Z" fill="#0a0a0a" opacity="0.7"/>
      <!-- Front bumper -->
      <path d="M120 300 L90 310 L90 330 L120 330 Z" fill="#111"/>
      <!-- Rear diffuser -->
      <path d="M780 300 L810 310 L810 330 L780 330 Z" fill="#111"/>
      <!-- Headlights -->
      <ellipse cx="130" cy="295" rx="14" ry="7" fill="#ffe066" opacity="0.9"/>
      <ellipse cx="130" cy="305" rx="14" ry="7" fill="#ffe066" opacity="0.9"/>
      <!-- Taillights -->
      <ellipse cx="790" cy="295" rx="12" ry="6" fill="#cc0000" opacity="0.9"/>
      <ellipse cx="790" cy="305" rx="12" ry="6" fill="#cc0000" opacity="0.9"/>
      <!-- Door lines -->
      <line x1="330" y1="210" x2="330" y2="330" stroke="#333" stroke-width="1.5"/>
      <line x1="560" y1="200" x2="560" y2="330" stroke="#333" stroke-width="1.5"/>
      <!-- Door handles -->
      <rect x="300" y="250" width="18" height="4" rx="2" fill="#555"/>
      <rect x="530" y="250" width="18" height="4" rx="2" fill="#555"/>

      <!-- MOD 1: Carbon Fiber Spoiler -->
      <path d="M620 185 L680 160 L700 175 L640 200 Z" fill="#2a2a2a" stroke="#ffcc00" stroke-width="2"/>
      <line x1="700" y1="175" x2="760" y2="130" class="mod-line"/>
      <text x="765" y="125" class="mod-label">Carbon Fiber Spoiler</text>

      <!-- MOD 2: Lowering Springs -->
      <line x1="250" y1="340" x2="250" y2="365" class="mod-line"/>
      <text x="180" y="385" class="mod-label">Lowering Springs</text>

      <!-- MOD 3: Performance Brakes -->
      <circle cx="250" cy="340" r="62" fill="none" stroke="#ffcc00" stroke-width="3" stroke-dasharray="6 4"/>
      <line x1="250" y1="278" x2="250" y2="230" class="mod-line"/>
      <text x="255" y="225" class="mod-label">Big Brake Kit</text>

      <!-- MOD 4: Aftermarket Wheels -->
      <circle cx="650" cy="340" r="48" fill="none" stroke="#ffcc00" stroke-width="2.5"/>
      <line x1="650" y1="292" x2="650" y2="250" class="mod-line"/>
      <text x="655" y="245" class="mod-label">Forged Wheels</text>

      <!-- MOD 5: Window Tint -->
      <path d="M250 210 L330 190 L480 185 L560 200 L620 235 L560 250 L330 250 L250 235 Z" fill="#1a1a2e" opacity="0.3"/>
      <line x1="480" y1="185" x2="480" y2="140" class="mod-line"/>
      <text x="485" y="135" class="mod-label">Ceramic Tint</text>

      <!-- MOD 6: Track Package -->
      <path d="M160 300 L180 250 L200 250 L185 305 Z" fill="#cc0000" opacity="0.6"/>
      <line x1="160" y1="300" x2="100" y2="250" class="mod-line"/>
      <text x="40" y="245" class="mod-label">Track Package</text>

      <!-- MOD 7: PPF -->
      <path d="M120 300 Q150 270 180 250 L180 265 Q150 285 120 315 Z" fill="#4a90d9" opacity="0.25"/>
      <line x1="120" y1="300" x2="60" y2="340" class="mod-line"/>
      <text x="10" y="355" class="mod-label">Paint Protection Film</text>

      <!-- MOD 8: Sound System -->
      <circle cx="450" cy="230" r="10" fill="#ffcc00"/>
      <line x1="450" y1="230" x2="450" y2="190" class="mod-line"/>
      <text x="455" y="185" class="mod-label">Premium Audio</text>

      <!-- MOD 9: FSD Computer -->
      <rect x="400" y="250" width="30" height="20" rx="4" fill="#00cc66" opacity="0.8"/>
      <line x1="415" y1="250" x2="415" y2="210" class="mod-line"/>
      <text x="420" y="205" class="mod-label">FSD Hardware</text>

      <!-- MOD 10: Chill/Ludicrous Mode badge -->
      <rect x="340" y="300" width="90" height="22" rx="11" fill="#cc0000"/>
      <text x="385" y="316" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">PLAID MODE</text>
    </svg>
  </div>
  <p class="footer">Built with pure HTML and SVG — no frameworks, no nonsense.</p>
</body>
</html>
